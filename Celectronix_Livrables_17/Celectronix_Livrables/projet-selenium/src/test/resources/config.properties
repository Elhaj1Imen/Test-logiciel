# ===== Configuration des tests celectronix.com =====
# Chaque propriete peut etre surchargee en ligne de commande : mvn test -Dbrowser=firefox
base.url=https://www.celectronix.com/
browser=chrome
headless=false
timeout=15
# Pause (en millisecondes) apres chaque page chargee et avant chaque clic, pour pouvoir suivre le test a l'ecran.
# 1500 = bien visible ; 0 = test rapide. Ou en ligne de commande : mvn test -Ddemo.pause.ms=0
demo.pause.ms=1500
# Mot-cle de secours (chaque test a son propre mot-cle dans testdata/keywords.csv)
search.keyword=ordinateur
# Produit de reference pour le controle de coherence du prix (TC11) : affiche 0,000 TND avec bouton "Ajouter au panier"
anomaly.product.url=https://www.celectronix.com/pieces-detachees-electromenager/9852-xmsr00112-moteur-de-distributeur-d-additifs-pour-lave-linge-chargement-par-le-haut.html


# TC02 (code promo) : false = test ignore (Skipped) ; true = le test s'execute
promo.test.enabled=false
